{% extends 'base.html' %}
{% block content %}
<style>
.auth-page {
  position: fixed; inset: 64px 0 0 0;
  display: flex; align-items: center; justify-content: center;
  background:
    linear-gradient(to bottom, rgba(8,8,16,0.6) 0%, rgba(8,8,16,0.88) 100%),
    url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1600&q=80');
  background-size: cover; background-position: center;
  padding: 24px;
}
.auth-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px; padding: 48px 44px;
  width: 100%; max-width: 420px;
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  animation: fadeUp .5s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:translateY(0); }
}
.auth-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 40px; letter-spacing: 4px;
  color: var(--red); text-align: center;
  margin-bottom: 6px;
  text-shadow: 0 0 30px rgba(229,9,20,0.5);
}
.auth-subtitle {
  text-align: center; color: var(--muted);
  font-size: 14px; margin-bottom: 36px;
}
.auth-label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.auth-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  padding: 14px 16px; color: #fff;
  font-size: 15px; margin-bottom: 20px;
  outline: none; transition: border-color .2s, box-shadow .2s;
  font-family: 'DM Sans', sans-serif; box-sizing: border-box;
}
.auth-input:focus {
  border-color: rgba(229,9,20,0.6);
  box-shadow: 0 0 0 3px rgba(229,9,20,0.12);
}
.auth-input::placeholder { color: rgba(255,255,255,0.2); }
.auth-btn {
  width: 100%; background: var(--red); color: #fff;
  border: none; border-radius: var(--radius-sm);
  padding: 15px; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background .2s, box-shadow .2s;
  font-family: 'DM Sans', sans-serif; margin-top: 4px;
  box-shadow: 0 4px 20px rgba(229,9,20,0.35);
}
.auth-btn:hover {
  background: var(--red-dark);
  box-shadow: 0 8px 32px rgba(229,9,20,0.55);
}
.auth-footer {
  text-align: center; margin-top: 28px;
  font-size: 13px; color: var(--muted);
}
.auth-footer a { color: var(--text); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { color: var(--red); }
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 24px 0; color: var(--muted); font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(255,255,255,0.08);
}
.error-msg {
  background: rgba(229,9,20,0.1);
  border: 1px solid rgba(229,9,20,0.25);
  color: #ff6b6b; border-radius: var(--radius-sm);
  padding: 12px 16px; font-size: 13px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">PFEFLIX</div>
    <div class="auth-subtitle">Sign in to continue</div>

    {% if form.errors %}
    <div class="error-msg">
      <i data-lucide="alert-triangle" style="width:15px;height:15px;flex-shrink:0;"></i>
      Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label class="auth-label">Username</label>
      <input type="text" name="username" class="auth-input" placeholder="your username" required autofocus>

      <label class="auth-label">Password</label>
      <input type="password" name="password" class="auth-input" placeholder="••••••••" required>

      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-footer">
      New to PFEFLIX? <a href="/register/">Create an account</a>
    </div>
  </div>
</div>

<script>lucide.createIcons();</script>
{% endblock %}
