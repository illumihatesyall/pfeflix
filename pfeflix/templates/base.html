<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFEFLIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e50914;--red-dark:#b0060f;
  --bg:#0a0a0a;--surface:#111111;--surface2:#1a1a1a;--surface3:#222222;
  --border:#2a2a2a;--text:#f0f0f0;--muted:#888;--card-radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* NAV */
nav{position:sticky;top:0;z-index:999;display:flex;justify-content:space-between;align-items:center;padding:0 48px;height:64px;background:rgba(10,10,10,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--red);text-decoration:none;}
.nav-links{display:flex;align-items:center;gap:6px;}
.nav-links a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;transition:color .2s,background .2s;}
.nav-links a:hover{color:var(--text);background:var(--surface2);}
.nav-links a.active{color:var(--text);}
.nav-btn{background:var(--red)!important;color:#fff!important;padding:7px 18px!important;border-radius:8px!important;}
.nav-btn:hover{background:var(--red-dark)!important;}

/* MAIN */
.page-wrap{min-height:calc(100vh - 64px - 56px);padding:40px 48px;}

/* HERO */
.hero{position:relative;height:90vh;min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 64px 80px;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-image:linear-gradient(to top,rgba(10,10,10,1) 0%,rgba(10,10,10,.5) 50%,rgba(10,10,10,.2) 100%),linear-gradient(to right,rgba(10,10,10,.7) 0%,transparent 60%),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=80');background-size:cover;background-position:center;}
.hero-content{position:relative;max-width:680px;}
.hero-badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border-radius:4px;margin-bottom:20px;}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,8vw,96px);line-height:.95;letter-spacing:2px;color:#fff;margin-bottom:20px;}
.hero p{font-size:17px;color:#ccc;line-height:1.6;margin-bottom:36px;max-width:540px;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:transform .15s,background .2s,opacity .2s;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-sm{padding:8px 18px;font-size:13px;}

/* SECTION */
.section-header{display:flex;align-items:baseline;gap:16px;margin-bottom:24px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text);}
.section-count{font-size:13px;color:var(--muted);}

/* CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}

/* MOVIE CARD */
.card{background:var(--surface);border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--border);transition:transform .25s,border-color .25s,box-shadow .25s;cursor:pointer;}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:#444;box-shadow:0 20px 40px rgba(0,0,0,.6);}
.card-body{padding:14px;}
.card-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;color:var(--text);}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.badge{font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;}
.badge-platform-Netflix{background:#e50914;color:#fff;border-color:#e50914;}
.badge-platform-Amazon{background:#00A8E0;color:#fff;border-color:#00A8E0;}
.badge-platform-Disney{background:#113CCF;color:#fff;border-color:#113CCF;}
.badge-platform-Hulu{background:#1CE783;color:#000;border-color:#1CE783;}

/* STAR RATING */
.star-rating{display:flex;gap:3px;margin-top:8px;}
.star{font-size:18px;cursor:pointer;color:#444;transition:color .1s,transform .1s;}
.star:hover,.star.lit{color:#f5c518;}
.star:hover{transform:scale(1.2);}
.rated-check{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#4caf50;margin-top:8px;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:32px;}
.search-wrap input{width:100%;padding:14px 20px 14px 48px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;transition:border-color .2s;}
.search-wrap input:focus{outline:none;border-color:#555;}
.search-wrap input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);pointer-events:none;}

/* FILTER BAR */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
.filter-chip{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;}
.filter-chip:hover,.filter-chip.active{background:var(--red);color:#fff;border-color:var(--red);}

/* FORMS */
.form-page{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:40px 24px;}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.form-card h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;margin-bottom:8px;}
.form-card .subtitle{color:var(--muted);font-size:14px;margin-bottom:32px;}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.form-group input,.form-group select{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;transition:border-color .2s;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#555;}
.form-group input::placeholder{color:#555;}
.form-group select option{background:var(--surface2);}
.helptext{font-size:12px;color:var(--muted);margin-top:5px;}
.errorlist{list-style:none;margin-top:5px;}
.errorlist li{font-size:12px;color:#ff6b6b;}
.form-footer{text-align:center;margin-top:24px;font-size:14px;color:var(--muted);}
.form-footer a{color:var(--red);text-decoration:none;font-weight:500;}

/* QUESTIONNAIRE */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:680px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.q-card h1{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:2px;margin-bottom:8px;}
.q-card .subtitle{color:var(--muted);font-size:15px;margin-bottom:36px;}
.q-section{margin-bottom:32px;}
.q-section-title{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.genre-grid{display:flex;flex-wrap:wrap;gap:8px;}
.genre-pill input[type=checkbox]{display:none;}
.genre-pill label{display:block;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.genre-pill input:checked + label{background:var(--red);color:#fff;border-color:var(--red);}
.genre-pill label:hover{border-color:#555;color:var(--text);}
.q-select{width:100%;padding:13px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;cursor:pointer;transition:border-color .2s;}
.q-select:focus{outline:none;border-color:#555;}
.q-select option{background:var(--surface2);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.5;}
.empty-state h2{font-size:20px;color:var(--text);margin-bottom:8px;}
.empty-state p{font-size:15px;margin-bottom:24px;}

/* FOOTER */
footer{text-align:center;padding:18px;color:#333;font-size:13px;border-top:1px solid var(--border);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(80px);opacity:0;transition:all .3s ease;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* ANIMATIONS */
.fade-in{animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.stagger > *{animation:fadeUp .4s ease both;}
.stagger > *:nth-child(1){animation-delay:.05s;}
.stagger > *:nth-child(2){animation-delay:.1s;}
.stagger > *:nth-child(3){animation-delay:.15s;}
.stagger > *:nth-child(4){animation-delay:.2s;}
.stagger > *:nth-child(5){animation-delay:.25s;}
.stagger > *:nth-child(n+6){animation-delay:.3s;}

/* ══════════════════════════════════════════
   CHATBOT
══════════════════════════════════════════ */
{% if user.is_authenticated %}
#chat-bubble{
  position:fixed;bottom:32px;right:32px;z-index:1000;
  width:56px;height:56px;border-radius:50%;
  background:var(--red);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 4px 24px rgba(229,9,20,.5);
  transition:transform .2s,box-shadow .2s;
}
#chat-bubble:hover{transform:scale(1.1);box-shadow:0 6px 32px rgba(229,9,20,.7);}
#chat-bubble .bubble-badge{
  position:absolute;top:-4px;right:-4px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;color:var(--red);
  font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(0);transition:all .2s;
}
#chat-bubble.has-notif .bubble-badge{opacity:1;transform:scale(1);}

#chat-window{
  position:fixed;bottom:104px;right:32px;z-index:1000;
  width:380px;max-height:600px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
  display:flex;flex-direction:column;
  transform:translateY(20px) scale(.95);opacity:0;
  pointer-events:none;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
#chat-window.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all;}

.chat-header{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.chat-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--red),#ff6b35);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.chat-header-info{flex:1;}
.chat-header-name{font-weight:600;font-size:14px;}
.chat-header-status{font-size:11px;color:#4caf50;display:flex;align-items:center;gap:4px;}
.chat-header-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block;}
.chat-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:4px;transition:color .2s;}
.chat-close:hover{color:var(--text);}

.chat-messages{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  max-height:340px;scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.msg{max-width:85%;animation:fadeUp .3s ease;}
.msg-bot{align-self:flex-start;}
.msg-user{align-self:flex-end;}
.msg-bubble{
  padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;
}
.msg-bot .msg-bubble{background:var(--surface2);color:var(--text);border-bottom-left-radius:4px;}
.msg-user .msg-bubble{background:var(--red);color:#fff;border-bottom-right-radius:4px;}

/* Option pills */
.chat-options{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
.chat-option{
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;
  border:1px solid var(--border);background:var(--surface3);color:var(--text);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chat-option:hover{background:var(--red);border-color:var(--red);color:#fff;}
.chat-option:disabled{opacity:.4;cursor:default;}

/* Mini movie cards in chat */
.chat-movies{display:flex;flex-direction:column;gap:8px;margin-top:6px;width:100%;}
.chat-movie-card{
  background:var(--surface3);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;
  display:flex;flex-direction:column;gap:3px;
}
.chat-movie-title{font-size:13px;font-weight:600;color:var(--text);}
.chat-movie-meta{display:flex;gap:6px;flex-wrap:wrap;}
.chat-movie-meta span{font-size:10px;color:var(--muted);}

/* Typing indicator */
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce .8s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}

.chat-input-row{
  padding:12px 16px;border-top:1px solid var(--border);
  display:flex;gap:8px;align-items:center;
}
#chatInput{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:9px 14px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:13px;
}
#chatInput:focus{outline:none;border-color:#555;}
#chatInput::placeholder{color:#555;}
#chatSendBtn{
  background:var(--red);border:none;border-radius:10px;
  padding:9px 14px;color:#fff;cursor:pointer;font-size:16px;
  transition:background .2s;flex-shrink:0;
}
#chatSendBtn:hover{background:var(--red-dark);}
#chatRestartBtn{
  background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:13px;padding:4px 8px;
  transition:color .2s;white-space:nowrap;
}
#chatRestartBtn:hover{color:var(--text);}
{% endif %}
</style>
</head>

<body>
<nav>
  <a href="/" class="nav-logo">PFEFLIX</a>
  <div class="nav-links">
    <a href="/" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a>
    {% if user.is_authenticated %}
    <a href="/recommendations/" {% if request.resolver_match.url_name == 'recommendations' %}class="active"{% endif %}>Discover</a>
    <a href="/questionnaire/" {% if request.resolver_match.url_name == 'questionnaire' %}class="active"{% endif %}>Preferences</a>
    <a href="/logout/" class="nav-btn btn">Sign Out</a>
    {% else %}
    <a href="/login/">Sign In</a>
    <a href="/register/" class="nav-btn btn">Get Started</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

<footer>© 2026 PFEFLIX — AI-Powered Entertainment Discovery</footer>

<div class="toast" id="toast"></div>

{% if user.is_authenticated %}
<!-- ── CHATBOT BUBBLE ── -->
<button id="chat-bubble" onclick="toggleChat()" title="Ask PFEFLIX AI">
  <span id="bubble-icon">🎬</span>
  <span class="bubble-badge" id="bubble-badge">1</span>
</button>

<!-- ── CHATBOT WINDOW ── -->
<div id="chat-window">
  <div class="chat-header">
    <div class="chat-avatar">🤖</div>
    <div class="chat-header-info">
      <div class="chat-header-name">PFEFLIX AI</div>
      <div class="chat-header-status">Online</div>
    </div>
    <button class="chat-close" onclick="toggleChat()">×</button>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-row">
    <button id="chatRestartBtn" onclick="restartChat()" title="Start over">↺ Restart</button>
    <input type="text" id="chatInput" placeholder="Type or pick an option above…" onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="chatSendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const CSRF = '{{ csrf_token }}';
let chatOpen = false;
let currentStep = 0;
let waitingForBot = false;
let chatStarted = false;

function toggleChat(){
  chatOpen = !chatOpen;
  document.getElementById('chat-window').classList.toggle('open', chatOpen);
  document.getElementById('bubble-icon').textContent = chatOpen ? '✕' : '🎬';
  document.getElementById('chat-bubble').classList.remove('has-notif');
  if(chatOpen && !chatStarted){
    chatStarted = true;
    setTimeout(() => botTurn(0, ''), 400);
  }
}

function appendMsg(text, isBot, options=[], movies=[]){
  const msgs = document.getElementById('chatMessages');

  const div = document.createElement('div');
  div.className = 'msg ' + (isBot ? 'msg-bot' : 'msg-user');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  div.appendChild(bubble);

  if(options.length){
    const optRow = document.createElement('div');
    optRow.className = 'chat-options';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'chat-option';
      btn.textContent = opt;
      btn.onclick = () => {
        // Disable all options
        optRow.querySelectorAll('.chat-option').forEach(b => b.disabled = true);
        optRow.querySelectorAll('.chat-option').forEach(b => b.style.opacity = '.4');
        sendMessage(opt);
      };
      optRow.appendChild(btn);
    });
    div.appendChild(optRow);
  }

  if(movies.length){
    const movieList = document.createElement('div');
    movieList.className = 'chat-movies';
    movies.forEach(m => {
      const card = document.createElement('div');
      card.className = 'chat-movie-card';
      card.innerHTML = `
        <div class="chat-movie-title">${m.title}</div>
        <div class="chat-movie-meta">
          <span>📺 ${m.platform}</span>
          ${m.year ? '<span>🗓 '+m.year+'</span>' : ''}
          <span>🎭 ${m.genres}</span>
        </div>`;
      movieList.appendChild(card);
    });
    div.appendChild(movieList);

    // Show search link
    const link = document.createElement('a');
    link.href = '/recommendations/';
    link.style.cssText = 'font-size:12px;color:var(--red);margin-top:8px;display:inline-block;';
    link.textContent = '→ See full recommendations';
    div.appendChild(link);
  }

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(){
  const msgs = document.getElementById('chatMessages');
  const t = document.createElement('div');
  t.className = 'msg msg-bot';
  t.id = 'typing-indicator';
  t.innerHTML = '<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(t);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping(){
  const t = document.getElementById('typing-indicator');
  if(t) t.remove();
}

async function botTurn(step, userMsg){
  if(waitingForBot) return;
  waitingForBot = true;
  showTyping();

  try {
    const res = await fetch('/chatbot/', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-CSRFToken': CSRF},
      body: JSON.stringify({message: userMsg.toLowerCase(), step})
    });
    const data = await res.json();
    removeTyping();

    appendMsg(data.reply, true, data.options || [], data.movies || []);
    currentStep = data.next_step === 'done' ? -1 : data.next_step;
  } catch(e){
    removeTyping();
    appendMsg("Oops, something went wrong. Try again!", true);
  }
  waitingForBot = false;
}

function sendMessage(text){
  const input = document.getElementById('chatInput');
  const msg = text || input.value.trim();
  if(!msg || waitingForBot) return;

  input.value = '';
  appendMsg(msg, false);

  if(currentStep === -1){
    appendMsg("You've got your picks! 🎬 Want to start over?", true, ['🔄 Start over']);
    return;
  }
  botTurn(currentStep, msg);
}

function restartChat(){
  document.getElementById('chatMessages').innerHTML = '';
  currentStep = 0;
  waitingForBot = false;
  botTurn(0, '');
}

// Show notification badge after 3s if chat not opened
setTimeout(() => {
  if(!chatOpen){
    document.getElementById('chat-bubble').classList.add('has-notif');
    document.getElementById('bubble-badge').textContent = '👋';
  }
}, 3000);
</script>
{% endif %}

<script>
function showToast(msg, emoji='✓'){
  const t = document.getElementById('toast');
  t.textContent = emoji + ' ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
