<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFEFLIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e50914;
  --red-dark:#b0060f;
  --bg:#0a0a0a;
  --surface:#111111;
  --surface2:#1a1a1a;
  --surface3:#222222;
  --border:#2a2a2a;
  --text:#f0f0f0;
  --muted:#888;
  --card-radius:14px;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:999;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 48px;height:64px;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.nav-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;letter-spacing:3px;
  color:var(--red);text-decoration:none;
}

.nav-links{display:flex;align-items:center;gap:6px;}

.nav-links a{
  color:var(--muted);text-decoration:none;
  padding:7px 14px;border-radius:8px;
  font-size:14px;font-weight:500;
  transition:color .2s, background .2s;
}
.nav-links a:hover{color:var(--text);background:var(--surface2);}
.nav-links a.active{color:var(--text);}

.nav-btn{
  background:var(--red)!important;
  color:#fff!important;
  padding:7px 18px!important;
  border-radius:8px!important;
}
.nav-btn:hover{background:var(--red-dark)!important;}

/* ── MAIN ── */
.page-wrap{
  min-height:calc(100vh - 64px - 56px);
  padding:40px 48px;
}

/* ── HERO ── */
.hero{
  position:relative;
  height:90vh;min-height:520px;
  display:flex;flex-direction:column;
  justify-content:flex-end;
  padding:0 64px 80px;
  overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(to top, rgba(10,10,10,1) 0%, rgba(10,10,10,.5) 50%, rgba(10,10,10,.2) 100%),
    linear-gradient(to right, rgba(10,10,10,.7) 0%, transparent 60%),
    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=80');
  background-size:cover;background-position:center;
}
.hero-content{position:relative;max-width:680px;}
.hero-badge{
  display:inline-block;
  background:var(--red);
  color:#fff;font-size:11px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  padding:5px 12px;border-radius:4px;margin-bottom:20px;
}
.hero h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(52px,8vw,96px);
  line-height:.95;letter-spacing:2px;
  color:#fff;margin-bottom:20px;
}
.hero p{
  font-size:17px;color:#ccc;line-height:1.6;
  margin-bottom:36px;max-width:540px;
}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;border:none;text-decoration:none;
  transition:transform .15s, background .2s, opacity .2s;
}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-sm{padding:8px 18px;font-size:13px;}

/* ── SECTION HEADERS ── */
.section-header{
  display:flex;align-items:baseline;gap:16px;
  margin-bottom:24px;
}
.section-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;letter-spacing:1px;color:var(--text);
}
.section-count{font-size:13px;color:var(--muted);}

/* ── CARD GRID ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}

/* ── MOVIE CARD ── */
.card{
  background:var(--surface);
  border-radius:var(--card-radius);
  overflow:hidden;
  border:1px solid var(--border);
  transition:transform .25s, border-color .25s, box-shadow .25s;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-6px) scale(1.02);
  border-color:#444;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
.card-poster{
  width:100%;aspect-ratio:2/3;
  object-fit:cover;display:block;
  background:var(--surface2);
}
.card-poster-placeholder{
  width:100%;aspect-ratio:2/3;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--surface2),var(--surface3));
  color:var(--muted);font-size:13px;text-align:center;padding:16px;
  gap:10px;
}
.card-poster-placeholder .icon{font-size:32px;opacity:.5;}
.card-body{padding:14px;}
.card-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:6px;color:var(--text);
}
.card-meta{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:10px;
}
.badge{
  font-size:10px;font-weight:600;letter-spacing:.5px;
  padding:3px 8px;border-radius:4px;
  background:var(--surface2);color:var(--muted);
  border:1px solid var(--border);
  white-space:nowrap;
}
.badge-platform-Netflix{background:#e50914;color:#fff;border-color:#e50914;}
.badge-platform-Amazon{background:#00A8E0;color:#fff;border-color:#00A8E0;}
.badge-platform-Disney{background:#113CCF;color:#fff;border-color:#113CCF;}
.badge-platform-Hulu{background:#1CE783;color:#000;border-color:#1CE783;}

/* ── STAR RATING ── */
.star-rating{display:flex;gap:3px;margin-top:8px;}
.star{
  font-size:18px;cursor:pointer;color:#444;
  transition:color .1s, transform .1s;
}
.star:hover,.star.lit{color:#f5c518;}
.star:hover{transform:scale(1.2);}
.rated-check{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;color:#4caf50;margin-top:8px;
}

/* ── SEARCH BAR ── */
.search-wrap{
  position:relative;margin-bottom:32px;
}
.search-wrap input{
  width:100%;padding:14px 20px 14px 48px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  transition:border-color .2s;
}
.search-wrap input:focus{outline:none;border-color:#555;}
.search-wrap input::placeholder{color:var(--muted);}
.search-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--muted);pointer-events:none;
}

/* ── FILTER BAR ── */
.filter-bar{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-bottom:28px;
}
.filter-chip{
  padding:7px 16px;border-radius:20px;
  font-size:13px;font-weight:500;
  border:1px solid var(--border);
  background:var(--surface);color:var(--muted);
  cursor:pointer;transition:all .2s;
}
.filter-chip:hover,.filter-chip.active{
  background:var(--red);color:#fff;border-color:var(--red);
}

/* ── FORMS ── */
.form-page{
  display:flex;align-items:center;justify-content:center;
  min-height:calc(100vh - 64px);
  padding:40px 24px;
}
.form-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;padding:44px;
  width:100%;max-width:480px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.form-card h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;letter-spacing:2px;margin-bottom:8px;
}
.form-card .subtitle{color:var(--muted);font-size:14px;margin-bottom:32px;}

.form-group{margin-bottom:20px;}
.form-group label{
  display:block;font-size:13px;font-weight:500;
  color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:8px;
}
.form-group input,.form-group select{
  width:100%;padding:12px 16px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  transition:border-color .2s;
}
.form-group input:focus,.form-group select:focus{
  outline:none;border-color:#555;
}
.form-group input::placeholder{color:#555;}
.form-group select option{background:var(--surface2);}

/* Helptext & errors */
.helptext{font-size:12px;color:var(--muted);margin-top:5px;}
.errorlist{list-style:none;margin-top:5px;}
.errorlist li{font-size:12px;color:#ff6b6b;}

.form-footer{text-align:center;margin-top:24px;font-size:14px;color:var(--muted);}
.form-footer a{color:var(--red);text-decoration:none;font-weight:500;}
.form-footer a:hover{text-decoration:underline;}

/* ── QUESTIONNAIRE ── */
.q-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:44px;
  width:100%;max-width:680px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.q-card h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:40px;letter-spacing:2px;margin-bottom:8px;
}
.q-card .subtitle{color:var(--muted);font-size:15px;margin-bottom:36px;}

.q-section{margin-bottom:32px;}
.q-section-title{
  font-size:12px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:14px;
}

/* Genre checkboxes as pills */
.genre-grid{
  display:flex;flex-wrap:wrap;gap:8px;
}
.genre-pill input[type=checkbox]{display:none;}
.genre-pill label{
  display:block;
  padding:8px 16px;border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);
  font-size:13px;font-weight:500;cursor:pointer;
  transition:all .2s;
}
.genre-pill input:checked + label{
  background:var(--red);color:#fff;border-color:var(--red);
}
.genre-pill label:hover{border-color:#555;color:var(--text);}

/* Select styling */
.q-select{
  width:100%;padding:13px 16px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;
  cursor:pointer;transition:border-color .2s;
}
.q-select:focus{outline:none;border-color:#555;}
.q-select option{background:var(--surface2);}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:80px 20px;color:var(--muted);
}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.5;}
.empty-state h2{font-size:20px;color:var(--text);margin-bottom:8px;}
.empty-state p{font-size:15px;margin-bottom:24px;}

/* ── FOOTER ── */
footer{
  text-align:center;padding:18px;
  color:#333;font-size:13px;
  border-top:1px solid var(--border);
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:14px 20px;
  font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);
  transform:translateY(80px);opacity:0;
  transition:all .3s ease;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}

/* ── ANIMATIONS ── */
.fade-in{animation:fadeUp .5s ease both;}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
.stagger > *{animation:fadeUp .4s ease both;}
.stagger > *:nth-child(1){animation-delay:.05s;}
.stagger > *:nth-child(2){animation-delay:.1s;}
.stagger > *:nth-child(3){animation-delay:.15s;}
.stagger > *:nth-child(4){animation-delay:.2s;}
.stagger > *:nth-child(5){animation-delay:.25s;}
.stagger > *:nth-child(n+6){animation-delay:.3s;}
</style>
</head>

<body>
<nav>
  <a href="/" class="nav-logo">PFEFLIX</a>
  <div class="nav-links">
    <a href="/" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a>
    {% if user.is_authenticated %}
    <a href="/recommendations/" {% if request.resolver_match.url_name == 'recommendations' %}class="active"{% endif %}>Discover</a>
    <a href="/questionnaire/" {% if request.resolver_match.url_name == 'questionnaire' %}class="active"{% endif %}>Preferences</a>
    <a href="/logout/" class="nav-btn btn">Sign Out</a>
    {% else %}
    <a href="/login/">Sign In</a>
    <a href="/register/" class="nav-btn btn">Get Started</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

<footer>© 2026 PFEFLIX — AI-Powered Entertainment Discovery</footer>

<div class="toast" id="toast"></div>

<script>
function showToast(msg, emoji='✓'){
  const t = document.getElementById('toast');
  t.textContent = emoji + ' ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
