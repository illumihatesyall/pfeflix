<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PFEFLIX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#0d0d0d;
color:white;
}

nav{
position:sticky;
top:0;
z-index:1000;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(10px);
}

.logo{
font-size:32px;
font-weight:bold;
color:red;
letter-spacing:1px;
}

nav a{
color:white;
text-decoration:none;
margin-left:22px;
font-weight:bold;
transition:0.3s;
}

nav a:hover{
color:red;
}

.container{
padding:40px 60px;
min-height:85vh;
}

.hero{
height:88vh;
display:flex;
flex-direction:column;
justify-content:center;
padding-left:70px;
background:
linear-gradient(to right, rgba(0,0,0,0.82), rgba(0,0,0,0.25)),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
}

.hero h1{
font-size:72px;
margin-bottom:20px;
max-width:700px;
}

.hero p{
font-size:22px;
color:#ddd;
max-width:650px;
margin-bottom:30px;
line-height:1.5;
}

button{
background:red;
color:white;
border:none;
padding:12px 24px;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:#c70000;
transform:scale(1.05);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:24px;
}

.card{
background:#1a1a1a;
padding:18px;
border-radius:16px;
transition:0.3s;
box-shadow:0 10px 24px rgba(0,0,0,0.35);
}

.card:hover{
transform:translateY(-8px) scale(1.02);
background:#252525;
}

input, select{
padding:12px;
width:100%;
margin-bottom:16px;
border:none;
border-radius:10px;
font-size:15px;
}

form{
max-width:520px;
margin:auto;
background:#171717;
padding:30px;
border-radius:18px;
box-shadow:0 10px 24px rgba(0,0,0,0.35);
}

footer{
text-align:center;
padding:25px;
color:#888;
border-top:1px solid #222;
}

.fade{
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}
/* ── Layout ── */
.page-wrap { padding: 40px 60px; min-height: 85vh; }

/* ── CSS Variables ── */
:root {
  --text: #ffffff;
  --muted: #888;
  --surface: #1a1a1a;
  --surface2: #252525;
  --surface3: #333;
  --border: #2a2a2a;
  --red: #e50914;
}

/* ── Grid ── */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; }

/* ── Card poster ── */
.card-poster-placeholder {
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: 10px 10px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.card-poster-placeholder .icon { font-size: 36px; }

/* ── Card body ── */
.card { padding: 0; border-radius: 12px; overflow: hidden; }
.card-body { padding: 14px; }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; line-height: 1.3;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

/* ── Badges ── */
.badge { font-size: 11px; padding: 3px 8px; border-radius: 6px;
         background: var(--surface3); color: var(--muted); border: 1px solid var(--border); }
.badge-platform-Netflix  { background:#1a0a0a; color:#e50914; border-color:#3a1515; }
.badge-platform-Amazon   { background:#0a1a2a; color:#00a8e1; border-color:#153050; }
.badge-platform-Disney   { background:#0a0a2a; color:#6b9fff; border-color:#15153a; }
.badge-platform-Hulu     { background:#0a2a0a; color:#3dba4e; border-color:#153a15; }

/* ── Stars ── */
.star-rating { display: flex; gap: 4px; }
.star { font-size: 20px; color: #444; cursor: pointer; transition: color .15s; }
.star:hover, .star.lit { color: #f5c518; }
.rated-check { font-size: 13px; color: #4caf50; font-weight: 600; }

/* ── Search ── */
.search-wrap { position: relative; margin-bottom: 20px; }
.search-wrap input { background: var(--surface2); border: 1px solid var(--border);
                     color: var(--text); border-radius: 10px; padding: 12px 16px 12px 40px;
                     font-size: 14px; width: 100%; outline: none; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }

/* ── Filter chips ── */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.filter-chip { background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
               border-radius: 20px; padding: 6px 16px; font-size: 13px; cursor: pointer;
               font-family: inherit; transition: all .2s; }
.filter-chip.active, .filter-chip:hover { background: var(--red); border-color: var(--red); color: #fff; }

/* ── Section header ── */
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-title { font-size: 18px; font-weight: 700; }
.section-count { font-size: 13px; color: var(--muted); }

/* ── Buttons ── */
.btn { display: inline-block; padding: 10px 20px; border-radius: 10px; font-size: 14px;
       font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: all .2s; }
.btn-primary { background: var(--red); color: #fff; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--red); color: var(--text); }
.btn-sm { padding: 7px 14px; font-size: 13px; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-state .icon { font-size: 56px; margin-bottom: 16px; }
.empty-state h2 { font-size: 24px; margin-bottom: 10px; }
.empty-state p { color: var(--muted); margin-bottom: 24px; }

/* ── Animations ── */
.fade-in { animation: fadeIn .5s ease; }
.stagger .card { animation: fadeIn .4s ease both; }
@keyframes fadeIn { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

/* ── Toast ── */
#toast { position:fixed; bottom:28px; right:28px; background:var(--surface2);
         border:1px solid var(--border); color:var(--text); padding:12px 20px;
         border-radius:12px; font-size:14px; opacity:0; pointer-events:none;
         transition:opacity .3s; z-index:9999; }
#toast.show { opacity:1; }

</style>
</head>

<body>

<nav>
<div class="logo">PFEFLIX</div>

<div>
<a href="/">Home</a>
<a href="/recommendations/">Recommendations</a>
<a href="/questionnaire/">Preferences</a>
<a href="/logout/">Logout</a>
</div>
</nav>

<div class="fade">
{% block content %}
{% endblock %}
</div>

<footer>
© 2026 PFEFLIX — AI Movie Recommendation Platform
</footer>

<div id="toast"></div>
<script>
function showToast(msg, icon='✓') {
  const t = document.getElementById('toast');
  t.textContent = icon + ' ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>

</body>
</html>
